<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantity Measurement App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css"/>
  <link rel="stylesheet" href="../css/home.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* ════════════════════════════════════════
       FIXED-SIZE MODALS — all three modals
       get an identical, stable box size
       ════════════════════════════════════════ */

    /* ── Auth modal (Sign In / Create Account) ── */
    #historyModal .modal {
      width: 460px;
      max-width: 96vw;
    }
    #historyModal .modal-bd {
      padding: 20px 24px;
      height: 460px;          /* fixed — NEVER changes between tabs */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    #historyModal .m-form {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
    }
    #historyModal .m-form.active { display: flex; }
    #historyModal .m-form .m-switch {
      margin-top: auto;
      padding-top: 8px;
    }

    /* ── All History modal ── */
    #allHistoryModal .modal {
      width: 600px;
      max-width: 96vw;
    }
    #allHistoryModal .modal-bd {
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    /* Filter bar — fixed, never scrolls */
    #allHistoryModal .hist-filter-bar {
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    /* Filter buttons — ALL same size, no change on active */
    #allHistoryModal .hist-filter-bar button {
      padding: 0;
      width: 80px;
      height: 32px;
      line-height: 32px;
      text-align: center;
      border-radius: 20px;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #allHistoryModal .hist-filter-bar button.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }
    /* Scrollable list area — fixed height so modal never grows */
    #allHistoryContent {
      height: 380px;
      overflow-y: auto;
      padding: 14px 20px;
      box-sizing: border-box;
    }
    #allHistoryContent::-webkit-scrollbar { width: 4px; }
    #allHistoryContent::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 4px;
    }
    /* History row */
    .hist-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 8px;
      background: var(--white);
      gap: 10px;
    }
    .hist-row:last-child { margin-bottom: 0; }
    .hist-op-badge {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--blue-light);
      color: var(--blue);
      white-space: nowrap;
      flex-shrink: 0;
      align-self: flex-start;
    }
    .hist-op-badge.err { background: #fee2e2; color: #dc2626; }
    .hist-expr {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .hist-err-msg {
      font-size: 11px;
      color: #dc2626;
      margin-top: 2px;
      display: block;
    }
    .hist-time {
      font-size: 11px;
      color: var(--text-light);
      white-space: nowrap;
      flex-shrink: 0;
      padding-top: 2px;
    }
    .hist-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="g_id_onload"
     data-client_id="673667107810-41a2oa9a6gor1nmk1u17q7cdeh3ti8ck.apps.googleusercontent.com"
     data-callback="handleGoogleCredential"
     data-auto_prompt="false"></div>

<!-- NAVBAR -->
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-logo" href="../index.html">
      <div class="site-logo-icon">📐</div>
      <span class="site-logo-text">Quantity<span>Measure</span></span>
    </a>
    <nav class="header-nav">
      <button class="header-nav-btn active" id="hnConverter"  onclick="switchMode('converter')">Converter</button>
      <button class="header-nav-btn"        id="hnComparison" onclick="switchMode('comparison')">Comparison</button>
      <button class="header-nav-btn"        id="hnArithmetic" onclick="switchMode('arithmetic')">Arithmetic</button>
    </nav>
    <div class="header-right" style="gap:8px;">
      <button class="home-nav-btn" onclick="showAllHistoryModal()">All History</button>
      <div id="navbarRightInner"></div>
    </div>
  </div>
</header>

<!-- APP SHELL -->
<div class="app-shell" id="appShell">

  <!-- MODE BAR -->
  <div class="mode-bar">
    <button class="mode-btn active" id="modeConverter"  onclick="switchMode('converter')">
      <span class="mode-icon">🔢</span><span>Converter</span>
    </button>
    <button class="mode-btn"        id="modeComparison" onclick="switchMode('comparison')">
      <span class="mode-icon">📊</span><span>Comparison</span>
    </button>
    <button class="mode-btn"        id="modeArithmetic" onclick="switchMode('arithmetic')">
      <span class="mode-icon">➗</span><span>Arithmetic</span>
    </button>
  </div>

  <div class="content-area">

    <!-- ══ CONVERTER PANEL ══ -->
    <div class="mode-panel active" id="panelConverter">
      <div class="panel-body">
        <div class="cat-row" id="categoryTabs"></div>
        <div class="card card-top">
          <div class="card-title" id="converterHeading"><span>📏</span> Length Converter</div>
          <div class="converter-row">
            <div>
              <label class="inp-label">From</label>
              <div class="field-pair">
                <input type="number" class="num-input" id="fromValue" placeholder="Enter value"
                       onkeydown="if(event.key==='Enter') runConversion()"/>
                <select class="unit-select" id="fromUnit"></select>
              </div>
            </div>
            <div class="swap-wrap">
              <button class="swap-btn" onclick="swapUnits()" title="Swap">⇄</button>
            </div>
            <div>
              <label class="inp-label">To</label>
              <div class="field-pair">
                <select class="unit-select" id="toUnit"></select>
              </div>
            </div>
          </div>
          <div class="btn-row">
            <button class="action-btn" onclick="runConversion()">Convert</button>
          </div>
          <div class="conv-error" id="convError"></div>
          <div class="result-box" id="resultBox">
            <span class="result-label">Result</span>
            <span class="result-value" id="resultValue">—</span>
            <span class="result-unit"  id="resultUnit"></span>
            <span class="result-formula" id="resultFormula"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ COMPARISON PANEL ══ -->
    <div class="mode-panel" id="panelComparison">
      <div class="panel-body">
        <div class="cat-row" id="cmpCategoryTabs"></div>
        <div class="card card-top">
          <div class="card-title">Compare Two Values</div>
          <div class="cmp-grid">
            <div class="cmp-side">
              <div class="cmp-side-label"><span class="cmp-badge badge-a">A</span> Value A</div>
              <div class="field-pair">
                <input type="number" class="num-input" id="cmpValueA" placeholder="Enter value"
                       onkeydown="if(event.key==='Enter') runComparison()"/>
                <select class="unit-select" id="cmpUnitA"></select>
              </div>
            </div>
            <div class="cmp-side">
              <div class="cmp-side-label"><span class="cmp-badge badge-b">B</span> Value B</div>
              <div class="field-pair">
                <input type="number" class="num-input" id="cmpValueB" placeholder="Enter value"
                       onkeydown="if(event.key==='Enter') runComparison()"/>
                <select class="unit-select" id="cmpUnitB"></select>
              </div>
            </div>
          </div>
          <div class="btn-row">
            <button class="action-btn" onclick="runComparison()">Compare</button>
          </div>
          <div class="cmp-verdict verdict-na" id="cmpVerdict">Enter values and click Compare.</div>
        </div>
      </div>
    </div>

    <!-- ══ ARITHMETIC PANEL ══ -->
    <div class="mode-panel" id="panelArithmetic">
      <div class="panel-body">
        <div class="cat-row" id="arithCategoryTabs"></div>
        <div class="card card-top arith-full-card">
          <div class="card-title">Arithmetic</div>
          <div class="op-tabs">
            <button class="op-btn active" id="opAdd"      onclick="setOp('add')">＋ Add</button>
            <button class="op-btn"        id="opSubtract" onclick="setOp('subtract')">－ Subtract</button>
            <button class="op-btn"        id="opDivide"   onclick="setOp('divide')">÷ Divide</button>
          </div>
          <div class="arith-inputs-row">
            <div>
              <div class="arith-side-label"><span class="arith-badge">A</span> Value A</div>
              <div class="arith-field-pair">
                <input type="number" class="arith-num-input" id="arithValueA" placeholder="Enter value"
                       onkeydown="if(event.key==='Enter') runArithmetic()"/>
                <select class="arith-unit-sel" id="arithUnitA"></select>
              </div>
            </div>
            <div class="arith-op-col">
              <div class="op-sym-big" id="opSymbol">＋</div>
            </div>
            <div>
              <div class="arith-side-label"><span class="arith-badge">B</span> Value B</div>
              <div class="arith-field-pair">
                <input type="number" class="arith-num-input" id="arithValueB" placeholder="Enter value"
                       onkeydown="if(event.key==='Enter') runArithmetic()"/>
                <select class="arith-unit-sel" id="arithUnitB"></select>
              </div>
            </div>
          </div>
          <div class="btn-row">
            <button class="action-btn" onclick="runArithmetic()">Calculate</button>
          </div>
          <div class="arith-note" id="arithNote" style="display:none;"></div>
          <div class="arith-result-full">
            <div class="arf-label">Result</div>
            <div>
              <span class="arf-value" id="arithResultValue">—</span>
              <span class="arf-unit"  id="arithResultUnit"></span>
            </div>
            <div class="arf-expr" id="arithResultExpr"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /content-area -->
</div><!-- /app-shell -->

<!-- ══ SIGN-IN MODAL (fixed equal size for both tabs) ══ -->
<div class="modal-overlay" id="historyModal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-hd-title">Quantity<span>Measure</span></span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="m-tab active" id="hTabLogin"  onclick="switchTab('login')">Sign In</button>
      <button class="m-tab"        id="hTabSignup" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div class="modal-bd">

      <!-- LOGIN FORM -->
      <div class="m-form active" id="hFormLogin">
        <div class="google-btn-wrap" id="googleBtnHLogin"></div>
        <div class="or-divider">or</div>
        <div class="m-group">
          <label for="hlEmail">Username / Email</label>
          <input type="text" id="hlEmail" placeholder="your username or email"
                 autocomplete="username"
                 onkeydown="if(event.key==='Enter') doHomeLogin()"/>
          <div class="m-err" id="hlEmailErr"></div>
        </div>
        <div class="m-group">
          <label for="hlPw">Password</label>
          <div class="pw-wrap">
            <input type="password" id="hlPw" placeholder="Your password"
                   autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') doHomeLogin()"/>
            <span class="pw-eye" onclick="togglePw('hlPw',this)">👁</span>
          </div>
          <div class="m-err" id="hlPwErr"></div>
        </div>
        <button class="m-submit" id="hLoginBtn" onclick="doHomeLogin()">Sign In</button>
        <div class="m-msg" id="hLoginMsg"></div>
        <div class="m-switch">No account? <a onclick="switchTab('signup')">Create one free</a></div>
      </div>

      <!-- SIGNUP FORM -->
      <div class="m-form" id="hFormSignup">
        <div class="google-btn-wrap" id="googleBtnHSignup"></div>
        <div class="or-divider">or</div>
        <div class="m-group">
          <label for="hsName">Full Name</label>
          <input type="text" id="hsName" placeholder="Your name"
                 onkeydown="if(event.key==='Enter') doHomeSignup()"/>
          <div class="m-err" id="hsNameErr"></div>
        </div>
        <div class="m-group">
          <label for="hsEmail">Email</label>
          <input type="email" id="hsEmail" placeholder="you@example.com"
                 onkeydown="if(event.key==='Enter') doHomeSignup()"/>
          <div class="m-err" id="hsEmailErr"></div>
        </div>
        <div class="m-group">
          <label for="hsPw">Password</label>
          <div class="pw-wrap">
            <input type="password" id="hsPw" placeholder="Min. 6 characters"
                   onkeydown="if(event.key==='Enter') doHomeSignup()"/>
            <span class="pw-eye" onclick="togglePw('hsPw',this)">👁</span>
          </div>
          <div class="m-err" id="hsPwErr"></div>
        </div>
        <button class="m-submit" id="hSignupBtn" onclick="doHomeSignup()">Create Account</button>
        <div class="m-msg" id="hSignupMsg"></div>
        <div class="m-switch">Have an account? <a onclick="switchTab('login')">Sign in</a></div>
      </div>

    </div>
  </div>
</div>

<!-- ══ ALL HISTORY MODAL ══ -->
<div class="modal-overlay" id="allHistoryModal" onclick="closeAllHistoryModalOutside(event)">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-hd-title"> All Operations <span style="font-weight:400;font-size:13px;color:rgba(255,255,255,0.7)">from Database</span></span>
      <button class="modal-x" onclick="closeAllHistoryModal()">✕</button>
    </div>
    <div class="modal-bd">
      <!-- Filter bar: fixed, outside scroll area -->
      <div class="hist-filter-bar" id="histFilterBar">
        <!-- filled by JS -->
      </div>
      <!-- Scrollable list -->
      <div id="allHistoryContent">
        <div class="hist-empty">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script src="../js/units.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/home.js"></script>
</body>
</html>
